name: Build Redbull Kernel
on: workflow_dispatch
jobs:
build:
runs-on: ubuntu-22.04
steps:
- name: Free Disk Space
run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android
- name: Download Kernel Source
uses: actions/checkout@v4
- name: Install Build Tools
run: sudo apt-get update && sudo apt-get install -y bc bison build-essential ccache curl flex git libncurses5-dev libssl-dev libxml2-utils lzop python3 unzip wget zip zstd device-tree-compiler kmod libc6-dev-i386 lib32ncurses5-dev libx11-dev lib32z-dev libgl1-mesa-dev
- name: Setup Toolchain and Patch
run: |
sudo git clone --depth=1 github.com /root/proton-clang
patch -p1 < add-rtl88xxau-5.6.4.2-drivers.patch
patch -p1 --forward < add-wifi-injection-4.14.patch || true
- name: Compile Kernel
run: chmod +x 2.sh && sudo ./2.sh
- name: Package Magisk Zip
run: |
cp out/arch/arm64/boot/Image* flasher/ 2>/dev/null || true
cp out/arch/arm64/boot/dtbo.img flasher/ 2>/dev/null || true
printf "id=redbull-nethunter\nname=Redbull NetHunter Kernel\nversion=1.0\nversionCode=1\nauthor=NetHunter\ndescription=Custom NetHunter Kernel\n" > flasher/module.prop
cd flasher && zip -r9 ../redbull-nethunter-magisk.zip * -x .git README.md *placeholder
- name: Upload Kernel Zip
uses: actions/upload-artifact@v4
with:
name: redbull-nethunter-magisk
path: redbull-nethunter-magisk.zip
